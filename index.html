<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="نظام إدارة الحلاقة والتحميم — عيادة الكوخ البيطرية">
  <meta name="theme-color" content="#C026D3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>الكوخ البيطرية — الحلاقة والتحميم</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- FOUC-prevention: apply theme before stylesheets load -->
  <script>
    (function () {
      document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
  <!-- Styles first (render-critical) -->
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="styles/index.css">
  <!-- Core libs: Supabase needed early; others deferred -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <!-- QRCode is small (~8KB), load deferred -->
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@04f46c6/qrcode.min.js" defer></script>
  <!-- Chart.js loaded on-demand by DashboardView (not here) -->
</head>

<body>
  <!-- Animated Background -->
  <div id="animated-bg" class="animated-bg"></div>

  <!-- Navigation -->
  <nav id="main-nav" class="nav">
    <div class="nav-inner">
      <div class="nav-brand">
        <img src="assets/logo.svg" alt="الكوخ" class="nav-logo">
        <span class="nav-title">الكوخ</span>
      </div>
      <div class="nav-actions">
        <button id="logout-btn" class="logout-btn" style="display:none;" title="تسجيل الخروج">
          <span class="logout-icon">🚪</span>
          <span class="logout-text">خروج</span>
        </button>
        <button id="menu-toggle" class="menu-toggle-btn">
          <span class="menu-text">القائمة</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Fullscreen Menu Overlay -->
  <div id="fullscreen-menu" class="fullscreen-menu">
    <div class="menu-content">
      <!-- الصفحة الرئيسية: للجميع -->
      <a href="#home" class="menu-link" data-view="home">
        <span class="menu-number">01</span>
        <span class="menu-text">الصفحة الرئيسية</span>
      </a>
      <!-- تسجيل الدخول: للزوار فقط -->
      <a href="#login" class="menu-link" data-role="anonymous" data-view="login">
        <span class="menu-number">02</span>
        <span class="menu-text">تسجيل الدخول 🔐</span>
      </a>
      <!-- صفحة المهام: للموظفين فقط -->
      <a href="#employee" class="menu-link" data-role="employee" data-view="employee" style="display:none;">
        <span class="menu-number">03</span>
        <span class="menu-text">صفحة المهام 📋</span>
      </a>
      <!-- صفحات الطبيب -->
      <a href="#doctor" class="menu-link" data-role="doctor" data-view="doctor" style="display:none;">
        <span class="menu-number">04</span>
        <span class="menu-text">لوحة الطبيب 🩺</span>
      </a>
      <a href="#doctor/chat" class="menu-link" data-role="doctor" data-view="doctor" style="display:none;">
        <span class="menu-number">05</span>
        <span class="menu-text">چات الفريق 💬</span>
      </a>
      <a href="#reports/medical" class="menu-link" data-role="doctor" data-view="reports" style="display:none;">
        <span class="menu-number">06</span>
        <span class="menu-text">تقاريري الطبية 📊</span>
      </a>
      <!-- صفحات المنظم (operator + admin) -->
      <a href="#operator" class="menu-link" data-role="operator" data-view="operator" style="display:none;">
        <span class="menu-number">07</span>
        <span class="menu-text">صفحة المنظم 🗂️</span>
      </a>
      <a href="#case-history" class="menu-link" data-role="operator" data-view="case-history" style="display:none;">
        <span class="menu-number">08</span>
        <span class="menu-text">تاريخ الحالات 📜</span>
      </a>
      <!-- صفحات المدير فقط -->
      <a href="#case-history" class="menu-link" data-role="clinic-admin" data-view="case-history" style="display:none;">
        <span class="menu-number">09</span>
        <span class="menu-text">تاريخ الحالات 📜</span>
      </a>
      <a href="#employees" class="menu-link" data-role="clinic-admin" data-view="employees" style="display:none;">
        <span class="menu-number">10</span>
        <span class="menu-text">إدارة الموظفين 👷</span>
      </a>
      <a href="#reports/clinic" class="menu-link" data-role="clinic-admin" data-view="reports" style="display:none;">
        <span class="menu-number">11</span>
        <span class="menu-text">تقارير العيادة 📊</span>
      </a>
      <a href="#admin/doctors" class="menu-link" data-role="clinic-admin" data-view="admin" style="display:none;">
        <span class="menu-number">12</span>
        <span class="menu-text">إدارة الأطباء 👨‍⚕️</span>
      </a>
    </div>
  </div>

  <!-- App Container -->
  <main id="app" class="app-container">
    <!-- Views injected by JS -->
  </main>

  <!-- Toast notifications -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Sound for notifications -->
  <audio id="notification-sound" preload="none">
    <source
      src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdH+Jj4+LhoJ9eXd3eXyBhYmNj42KhoJ+fHp5eXyAhImNj46LhoJ9end4eHuAhImOj4+LiIN+fHt6fH+DhomMjIqHg398e3p7f4OHioyNjIiEgH58fH1/goaJi4yLiISAfn18fYCDh4qMjIuIhIB+fXx9gIOHiouMi4iEgH58fH2Ag4eKi4yLiISBf359fYCDh4mLi4qHg4B+fX19gIKGiYuLioeDgH5+fn+BhIeJiomHhIGAfn5+gIKFh4mJiIaCgH9+fn+BhIaIiYmHhIKAf35/gIKEhoeIh4WCgH9+f4CCg4WHh4aFg4GAfn5/gIGDhYaHhoSDgYB/f3+AgYOFhoeGhIOBgH9/f4CBg4WHhoWDgYB/f3+AgYOFhoaFg4GAf39/gIGDhYaGhYOBgH9/f4CBg4WHhoWDgYB/f4CAgYOFhoaFg4GAf39/gIGDhIaFhIOBgH9/gICBg4SEhYSDAICAgH+AgIGCg4SEBIKEAICAAIA="
      type="audio/wav">
  </audio>

  <!-- Scripts: config first, then app logic -->
  <script src="config.js" defer></script>
  <script src="main.js" defer></script>
</body>

</html>
